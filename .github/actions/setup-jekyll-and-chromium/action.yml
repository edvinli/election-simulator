# The website's build dependencies, in one place.
#
# The website's _config.yml declares five Jekyll plugins, so `gem install
# jekyll` alone produces a runner that looks provisioned and fails at
# `jekyll build` with an unresolved plugin. The rendering workflow shipped
# exactly that for as long as it never reached a real render: its one
# successful run skipped rendering because the website already served the
# generation, so the gap was never exercised.
#
# Kept as a composite action rather than copied a fourth time because the list
# is a contract with another repository: when the website adds a plugin, there
# should be one place here that has to learn about it.
name: Set up Jekyll and Chromium
description: Ruby, the website's full Jekyll plugin set, and a Chromium the browser suites can find.

inputs:
  ruby-version:
    description: Ruby version to install.
    required: false
    default: "3.3"

runs:
  using: composite
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}

    - name: Install Jekyll and Chromium when needed
      shell: bash
      run: |
        set -euo pipefail
        # Mirrors the `plugins:` list in the website's _config.yml. A missing
        # entry here is a build failure there, not a slower build.
        gem install \
          jekyll \
          jekyll-paginate \
          jekyll-sitemap \
          jekyll-gist \
          jekyll-feed \
          jekyll-redirect-from \
          --no-document
        if command -v chromium >/dev/null 2>&1; then
          CHROME_BIN_PATH="$(command -v chromium)"; CHROME_SOURCE="preinstalled chromium"
        elif command -v chromium-browser >/dev/null 2>&1; then
          CHROME_BIN_PATH="$(command -v chromium-browser)"; CHROME_SOURCE="preinstalled chromium-browser"
        elif command -v google-chrome >/dev/null 2>&1; then
          CHROME_BIN_PATH="$(command -v google-chrome)"; CHROME_SOURCE="preinstalled google-chrome"
        else
          sudo apt-get update
          sudo apt-get install -y chromium
          CHROME_BIN_PATH="$(command -v chromium)"; CHROME_SOURCE="apt-installed chromium"
        fi
        # Say which browser was chosen, and which build of it.
        #
        # This is a consequential choice made from whatever the runner image
        # happens to carry, and it was previously silent: when a render failed
        # with "Chrome did not expose CDP", the run gave no way to tell which
        # binary had been launched. The browser harness reports the same facts
        # from its own side; both are wanted, because a disagreement between
        # them means CHROME_BIN did not survive into the job.
        if [ -z "$CHROME_BIN_PATH" ]; then
          echo "::error::no usable browser was found or installed"
          exit 1
        fi
        echo "browser: $CHROME_BIN_PATH ($CHROME_SOURCE)"
        echo "version: $("$CHROME_BIN_PATH" --version 2>&1 | head -1 || echo unavailable)"
        echo "CHROME_BIN=$CHROME_BIN_PATH" >> "$GITHUB_ENV"
        # The browser harness bounds this at 60s and defaults to 30s. A
        # passing publication was observed launching in 23.7s and a rendering
        # job lost that race at 30.2s, so CI asks for the bound. It is not a
        # fix for a browser that cannot start: the harness fails such a launch
        # immediately regardless of the deadline.
        echo "CDP_READY_TIMEOUT_MS=60000" >> "$GITHUB_ENV"
