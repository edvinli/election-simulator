name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --locked asserts uv.lock will remain unchanged, so a lockfile that has
      # drifted from pyproject.toml fails the build instead of being silently
      # re-resolved to different dependency versions.
      - name: Install the project from the locked dependency set
        run: uv sync --locked

      # The REFERENCE publication contract test executes under Node, so Node
      # must be present or that coverage would silently skip.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the full unit test suite
        run: uv run python -m unittest discover -s tests -t . -v

      # Guard against the Node-dependent contract coverage regressing into a
      # silent skip. Only the contract class is asserted: the drift class in the
      # same module compares against the website source and correctly skips in
      # CI, where no edvinli.github.io checkout exists.
      - name: Assert the Node reference contract tests were not skipped
        run: |
          uv run python -m unittest -v \
            tests.test_reference_publication_contract.ReferencePublicationContractTests \
            2>&1 | tee reference.log
          if grep -q "skipped" reference.log; then
            echo "::error::Reference publication contract tests skipped; Node coverage was lost."
            exit 1
          fi

      # The ACTUAL browser consumer test evaluates the deployed website source
      # verbatim. CI has no edvinli.github.io checkout, so it is EXPECTED to
      # skip here and is authoritative only when run against that checkout.
      # This step records that state explicitly rather than letting a skip pass
      # unnoticed as if it were coverage.
      - name: Report cross-repository contract coverage status
        run: |
          uv run python -m unittest -v tests.test_actual_browser_consumer 2>&1 | tee actual.log || true
          if grep -q "skipped" actual.log; then
            echo "::notice::ACTUAL_BROWSER_CONSUMER_TEST skipped: no edvinli.github.io checkout in CI."
            echo "::notice::Contract coverage in CI is the REFERENCE reimplementation only."
          else
            echo "::notice::ACTUAL_BROWSER_CONSUMER_TEST ran against the deployed website source."
          fi
