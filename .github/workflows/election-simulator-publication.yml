name: Election Simulator publication

on:
  # Stockholm is UTC+2 through the 2026 election date. Keep these fixed UTC
  # schedules explicit and let the date guard stop the workflow afterwards.
  schedule:
    - cron: "0 4 * * *" # 06:00 Europe/Stockholm: always publish
    - cron: "0 6,8,10,12,14,16,18,20 * * *" # 08:00–22:00: poll-change checks
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, browser_diagnostic, dry_run, publish, or publish_if_stale"
        required: true
        default: dry_run
        type: choice
        options:
          - probe
          - browser_diagnostic
          - dry_run
          - publish
          # The fallback boundary. An external scheduler dispatches this when
          # the 04:00Z daily tick did not arrive; the automation then decides
          # whether today's mandatory recalculation is actually missing and
          # no-ops when it is not. Unlike publish it is subject to the
          # repository kill switch, because nobody is watching it.
          - publish_if_stale
      website_ref:
        description: "Public website branch/ref used by browser_diagnostic"
        required: false
        default: master
        type: string

permissions:
  contents: read

# There is deliberately no workflow-level concurrency group.
#
# election-simulator-production is shared with the prospective benchmark so a
# capture can never race a publication generation. Held at workflow level it
# also gates every *non*-mutating job, and -- the reason this moved -- it gated
# the fallback's own stand-down decision: a publish_if_stale run joined the
# group before any job started, so by the time it could decide to defer it was
# already holding the lock the benchmark was waiting for. An in-job check
# cannot protect something it has already blocked.
#
# The group now sits on the publish job alone, which is the only job that
# mutates anything. Scheduled and manual publication therefore serialize with
# the benchmark exactly as before, and fallback_preflight runs outside the
# group so it can stand down without ever queuing for it.
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'probe'
    permissions:
      contents: read
    runs-on: ${{ vars.ELECTION_SIMULATOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out simulator without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          path: simulator
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install simulator dependencies
        working-directory: simulator
        run: uv sync --frozen

      - name: Probe polling sources without repository writes
        working-directory: simulator
        shell: bash
        env:
          ELECTION_AUTOMATION_ENABLED: ${{ vars.ELECTION_AUTOMATION_ENABLED || 'false' }}
        run: |
          uv run python -m scripts.election_automation \
            --repo-root "$GITHUB_WORKSPACE/simulator" \
            --site-repo "$RUNNER_TEMP/election-probe-no-website" \
            --event-name workflow_dispatch \
            --mode probe \
            --automation-enabled "$ELECTION_AUTOMATION_ENABLED" \
            --summary-path "$GITHUB_STEP_SUMMARY"

  dry_run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'dry_run'
    permissions:
      contents: read
    runs-on: ${{ vars.ELECTION_SIMULATOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Check out simulator without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          path: simulator
          fetch-depth: 0
          persist-credentials: false

      - name: Clone public website without credentials
        shell: bash
        env:
          DRY_RUN_WEBSITE: ${{ runner.temp }}/election-website-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          test ! -e "$DRY_RUN_WEBSITE"
          git clone --depth=1 --branch master \
            https://github.com/edvinli/edvinli.github.io.git \
            "$DRY_RUN_WEBSITE"
          test "$(git -C "$DRY_RUN_WEBSITE" remote get-url origin)" = \
            "https://github.com/edvinli/edvinli.github.io.git"
          test -z "$(git -C "$DRY_RUN_WEBSITE" config --local --get credential.helper || true)"
          test -z "$(git -C "$DRY_RUN_WEBSITE" config --local --get-regexp '^http\..*\.extraheader$' || true)"
          echo "DRY_RUN_WEBSITE=$DRY_RUN_WEBSITE" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install simulator dependencies
        working-directory: simulator
        run: uv sync --frozen

      - name: Verify isolated read-only repository layout
        shell: bash
        run: |
          test "$(git -C simulator rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE/simulator"
          test "$(git -C "$DRY_RUN_WEBSITE" rev-parse --show-toplevel)" = "$DRY_RUN_WEBSITE"
          test -z "$(git -C simulator status --porcelain --untracked-files=all)"
          test -z "$(git -C "$DRY_RUN_WEBSITE" status --porcelain --untracked-files=all)"

      - name: Run backend and history contract tests
        working-directory: simulator
        run: |
          uv run python -m unittest \
            tests.test_publication_pipeline \
            tests.test_prospective_archive \
            tests.test_exact_draw_sidecar \
            tests.test_forecast_history_contract \
            tests.test_forecast_history \
            tests.test_site_publisher \
            tests.test_production_freeze \
            tests.test_publication_freeze \
            tests.test_polling_acquisition \
            tests.test_election_automation

      - name: Set up Node and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll and Chromium when needed
        shell: bash
        run: |
          gem install \
            jekyll \
            jekyll-paginate \
            jekyll-sitemap \
            jekyll-gist \
            jekyll-feed \
            jekyll-redirect-from \
            --no-document
          if command -v chromium >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v chromium-browser)"
          elif command -v google-chrome >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v google-chrome)"
          else
            sudo apt-get update
            sudo apt-get install -y chromium
            CHROME_BIN_PATH="$(command -v chromium)"
          fi
          echo "CHROME_BIN=$CHROME_BIN_PATH" >> "$GITHUB_ENV"

      - name: Run full dry-run without commits or pushes
        working-directory: simulator
        shell: bash
        env:
          ELECTION_AUTOMATION_ENABLED: ${{ vars.ELECTION_AUTOMATION_ENABLED || 'false' }}
        run: |
          uv run python -m scripts.election_automation \
            --repo-root "$GITHUB_WORKSPACE/simulator" \
            --site-repo "$DRY_RUN_WEBSITE" \
            --event-name workflow_dispatch \
            --mode dry_run \
            --automation-enabled "$ELECTION_AUTOMATION_ENABLED" \
            --summary-path "$GITHUB_STEP_SUMMARY"

  browser_diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'browser_diagnostic'
    permissions:
      contents: read
    runs-on: ${{ vars.ELECTION_SIMULATOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out public website without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: edvinli/edvinli.github.io
          ref: ${{ github.event.inputs.website_ref || 'master' }}
          path: website
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Report resolved website revision
        shell: bash
        run: |
          WEBSITE_COMMIT="$(git -C website rev-parse HEAD)"
          test "${#WEBSITE_COMMIT}" -eq 40
          echo "Website commit: $WEBSITE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Testing resolved website commit $WEBSITE_COMMIT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll and Chromium when needed
        shell: bash
        run: |
          gem install \
            jekyll \
            jekyll-paginate \
            jekyll-sitemap \
            jekyll-gist \
            jekyll-feed \
            jekyll-redirect-from \
            --no-document
          if command -v chromium >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v chromium-browser)"
          elif command -v google-chrome >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v google-chrome)"
          else
            sudo apt-get update
            sudo apt-get install -y chromium
            CHROME_BIN_PATH="$(command -v chromium)"
          fi
          echo "CHROME_BIN=$CHROME_BIN_PATH" >> "$GITHUB_ENV"

      - name: Jekyll build diagnostic
        working-directory: website
        run: timeout --signal=TERM --kill-after=5s 5m jekyll build --config _config.yml,_config.dev.yml

      - name: Forecast timeseries browser diagnostic
        working-directory: website
        run: >-
          timeout --signal=TERM --kill-after=5s 15m
          node browser-tests/forecast-timeseries.smoke.mjs _site

      - name: Government builder browser diagnostic
        working-directory: website
        run: >-
          timeout --signal=TERM --kill-after=5s 15m
          node browser-tests/government-builder.smoke.mjs _site

  # The unattended stand-down decision, outside election-simulator-production.
  #
  # This job exists because the decision has to be made *before* an unattended
  # publication can enter or queue for the production group. It never joins
  # that group; it takes a group of its own so two ticks cannot preflight at
  # once.
  #
  # It now covers the SCHEDULED crons as well as the publish_if_stale
  # fallback. It previously ran for the fallback alone, on the reasoning that
  # the two crons were part of the operating picture the benchmark protocol
  # was written against and that suppressing one would be a publication
  # semantics change rather than hardening. What that reasoning missed is that
  # one of those crons collides with the benchmark by the clock alone:
  #
  #   * the capture's pre-warm starts at 20:30Z (22:30 Stockholm, amendment
  #     005), and publish may hold election-simulator-production for up to its
  #     120-minute timeout, so the protected interval has to begin 120 minutes
  #     before the pre-warm -- 18:30Z -- and runs to 22:00Z;
  #   * the intraday schedule fires at 20:00Z, which is ALREADY INSIDE that
  #     interval. No delivery lateness is needed for the collision.
  #
  # Once a publication holds the lock there, an otherwise punctual capture
  # waits behind it and archives LATE_EXCLUDED.
  #
  # Delivery lateness strengthens the case rather than creating it: GitHub has
  # been delivering ticks 1h43m-2h42m late, so EARLIER nominal ticks can land
  # inside the interval too -- the 18:00Z one needs only 31 minutes of it.
  # But the 20:00Z collision stands with a perfectly punctual scheduler.
  #
  # The asymmetry decides it: a deferred poll-change publication is repaired
  # by the next tick, and a missed capture slot is frozen empty forever. The
  # mandatory daily publication is unaffected -- its 04:00Z tick is ~14.5
  # hours clear of the interval start, so no plausible lateness reaches it.
  #
  # It answers two questions the clock cannot answer on its own:
  #
  #   * is automation disabled? A publish_if_stale dispatch is unattended and
  #     is subject to the kill switch, unlike an operator's publish. This
  #     check stays scoped to that dispatch: a scheduled run's kill-switch
  #     handling remains in publish's own automation_gate, unchanged.
  #   * is a benchmark capture actually queued or running? GitHub has been
  #     delivering the 20:30Z capture cron 1h43m-2h42m late, so a capture can
  #     be live well outside its nominal window -- and a capture queued behind
  #     something else shows as `queued`, which is exactly the case a clock
  #     check misses.
  #
  # The frozen-window check is kept as a second, forward-looking guard: it
  # catches a capture GitHub has not created yet but is about to, which no
  # query of current runs can see. Neither guard is a widened blackout; the
  # window is the protocol's own, read from time_rules.py.
  fallback_preflight:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.mode == 'publish_if_stale')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: election-simulator-fallback-preflight
      cancel-in-progress: false
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Check out simulator without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The frozen window rule lives in scripts/publication_fallback.py, which
      # reads the cutoff from the protocol module rather than restating it.
      # Its import chain reaches numpy through the benchmark package's
      # __init__, so the environment is installed rather than the rule copied
      # into shell. This job is outside the production lock, so its runtime
      # costs the benchmark nothing.
      - name: Install simulator dependencies
        run: uv sync --frozen

      - name: Decide whether the fallback may take the production lock
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_ENABLED: ${{ vars.ELECTION_AUTOMATION_ENABLED || 'false' }}
          BENCHMARK_WORKFLOW: prospective-benchmark-2026.yml
          IS_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$IS_FALLBACK" == "true" ]]; then
            run_type="FALLBACK_DAILY"
            mode_label="PUBLISH_IF_STALE"
          else
            run_type="SCHEDULED"
            mode_label="SCHEDULE"
          fi
          stand_down() {
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            {
              echo "Run type: $run_type"
              echo "Mode: $mode_label"
              echo "Deployment status: $1"
              echo "Production lock: NOT_REQUESTED"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "unattended publication stands down before the production lock: $1"
            exit 0
          }

          # The kill switch governs the unattended publish_if_stale dispatch,
          # as before. It is deliberately NOT extended to the scheduled path:
          # a scheduled run's kill-switch handling stays in publish's own
          # automation_gate, so this change adds benchmark deferral and alters
          # nothing else about how a cron behaves. An operator's explicit
          # publish is subject to neither, and does not reach this job.
          if [[ "$IS_FALLBACK" == "true" && "${AUTOMATION_ENABLED,,}" == "false" ]]; then
            stand_down "DISABLED_BY_REPOSITORY_KILL_SWITCH"
          fi

          # A capture that is queued or in flight, whenever it was created.
          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${BENCHMARK_WORKFLOW}/runs?per_page=50" \
            --jq '[.workflow_runs[]
                   | select(.status == "queued" or .status == "in_progress"
                            or .status == "waiting" or .status == "pending"
                            or .status == "requested")] | length')"
          echo "benchmark runs queued or in flight: ${active}"
          if [[ "${active}" != "0" ]]; then
            stand_down "DEFERRED_BENCHMARK_RUN_ACTIVE"
          fi

          # A capture GitHub has not created yet but is about to. One line on
          # purpose: an indented -c payload inside a YAML block scalar is an
          # IndentationError waiting to happen.
          if ! uv run python -c 'import sys; from datetime import datetime, timezone; from scripts.publication_fallback import benchmark_window_conflict; slot = benchmark_window_conflict(datetime.now(timezone.utc)); print("benchmark window slot:", slot); sys.exit(0 if slot is None else 1)'; then
            stand_down "DEFERRED_BENCHMARK_WINDOW"
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "reason=CLEAR" >> "$GITHUB_OUTPUT"
          echo "unattended publication may request the production lock"

  publish:
    needs: [fallback_preflight]
    # always(), so an operator's explicit publish runs with fallback_preflight
    # skipped. The scheduled crons and publish_if_stale now both go through
    # the preflight, so for them this is a real gate rather than a skip.
    #
    # A preflight that failed is not a pass: this fails closed rather than
    # publishing when the stand-down decision could not be made. That now
    # applies to the scheduled path too, so a broken preflight defers a cron
    # instead of letting it race the benchmark. The recovery for a deferred
    # or blocked daily publication is the publish_if_stale fallback, which
    # republishes when daily_publication_satisfied() is false -- deliberately
    # the same repair path a late or dropped cron already relies on.
    #
    # This condition is unchanged by that: it already distinguished
    # "preflight skipped" from "preflight passed", and generalizing which
    # events reach the preflight is what changed.
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.mode == 'publish' ||
         github.event.inputs.mode == 'publish_if_stale'))) &&
      (needs.fallback_preflight.result == 'skipped' ||
       (needs.fallback_preflight.result == 'success' &&
        needs.fallback_preflight.outputs.proceed == 'true'))
    permissions:
      contents: write
    # The only job that mutates anything, and so the only one that takes the
    # production lock. Scheduled and manual publication serialize with the
    # benchmark exactly as they did when this group sat at workflow level.
    concurrency:
      group: election-simulator-production
      cancel-in-progress: false
    # Set repository variable ELECTION_SIMULATOR_RUNNER to a self-hosted label
    # when pollofpolls.se refuses GitHub-hosted runner traffic.
    runs-on: ${{ vars.ELECTION_SIMULATOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Check out simulator
        uses: actions/checkout@v4
        with:
          ref: main
          path: simulator
          fetch-depth: 0
          persist-credentials: true

      - name: Check repository automation kill switch
        id: automation_gate
        shell: bash
        env:
          AUTOMATION_ENABLED: ${{ vars.ELECTION_AUTOMATION_ENABLED || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ github.event_name == 'schedule' && 'publish' || github.event.inputs.mode }}
        run: |
          if [[ ( "$EVENT_NAME" != "workflow_dispatch" || "$MODE" == "publish_if_stale" ) \
                && "${AUTOMATION_ENABLED,,}" == "false" ]]; then
            echo "disabled=true" >> "$GITHUB_OUTPUT"
            {
              if [[ "$MODE" == "publish_if_stale" ]]; then RUN_TYPE="FALLBACK_DAILY"
              elif [[ "$EVENT_SCHEDULE" == "0 4 * * *" ]]; then RUN_TYPE="DAILY"
              else RUN_TYPE="POLL_CHANGE"; fi
              echo "Run type: $RUN_TYPE"
              echo "Mode: ${MODE^^}"
              echo "Forecast as_of: NOT_RUN"
              echo "PoP estimate date: NOT_RUN"
              echo "Polling source status: DISABLED_BY_REPOSITORY_KILL_SWITCH"
              echo "Polling source provenance: NOT_ACQUIRED"
              echo "Model-relevant inputs changed: no"
              echo "Simulation samples: 0"
              echo "Publication generation: NONE"
              echo "History current point: NONE"
              echo "Simulator commit: $(git -C simulator rev-parse HEAD)"
              echo "Website commit: NOT_CHECKED_OUT"
              echo "Deployment status: DISABLED_BY_REPOSITORY_KILL_SWITCH"
              echo "Recovery status: NONE"
              echo "Daily publication: NOT_CHECKED"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ELECTION_AUTOMATION_ENABLED=false; scheduled run exits before acquisition."
            exit 0
          fi
          echo "disabled=false" >> "$GITHUB_OUTPUT"
          echo "Automation enabled for ${EVENT_NAME}; mode=${MODE}."

      - name: Check out website artifacts repository
        if: steps.automation_gate.outputs.disabled != 'true'
        uses: actions/checkout@v4
        with:
          repository: edvinli/edvinli.github.io
          ref: master
          path: website
          fetch-depth: 0
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        if: steps.automation_gate.outputs.disabled != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        if: steps.automation_gate.outputs.disabled != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        if: steps.automation_gate.outputs.disabled != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install simulator dependencies
        if: steps.automation_gate.outputs.disabled != 'true'
        working-directory: simulator
        run: uv sync --frozen

      - name: Verify isolated repository layout
        if: steps.automation_gate.outputs.disabled != 'true'
        shell: bash
        run: |
          test "$(git -C simulator rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE/simulator"
          test "$(git -C website rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE/website"
          test -z "$(git -C simulator status --porcelain --untracked-files=all)"
          test -z "$(git -C website status --porcelain --untracked-files=all)"

      - name: Configure non-secret Git bot identity
        if: steps.automation_gate.outputs.disabled != 'true'
        shell: bash
        run: |
          for repo in simulator website; do
            git -C "$repo" config user.name "github-actions[bot]"
            git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          done
          test "$(git -C simulator config user.name)" = "github-actions[bot]"
          test "$(git -C simulator config user.email)" = "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git -C website config user.name)" = "github-actions[bot]"
          test "$(git -C website config user.email)" = "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run backend and history contract tests
        if: steps.automation_gate.outputs.disabled != 'true'
        working-directory: simulator
        run: |
          uv run python -m unittest \
            tests.test_publication_pipeline \
            tests.test_prospective_archive \
            tests.test_exact_draw_sidecar \
            tests.test_forecast_history_contract \
            tests.test_forecast_history \
            tests.test_site_publisher \
            tests.test_production_freeze \
            tests.test_publication_freeze \
            tests.test_polling_acquisition \
            tests.test_election_automation

      - name: Set up Node and Jekyll
        if: steps.automation_gate.outputs.disabled != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll and Chromium when needed
        if: steps.automation_gate.outputs.disabled != 'true'
        shell: bash
        run: |
          gem install \
            jekyll \
            jekyll-paginate \
            jekyll-sitemap \
            jekyll-gist \
            jekyll-feed \
            jekyll-redirect-from \
            --no-document
          if command -v chromium >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v chromium-browser)"
          elif command -v google-chrome >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v google-chrome)"
          else
            sudo apt-get update
            sudo apt-get install -y chromium
            CHROME_BIN_PATH="$(command -v chromium)"
          fi
          echo "CHROME_BIN=$CHROME_BIN_PATH" >> "$GITHUB_ENV"

      - name: Acquire, validate, publish, test, and sync
        if: steps.automation_gate.outputs.disabled != 'true'
        working-directory: simulator
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          ELECTION_AUTOMATION_ENABLED: ${{ vars.ELECTION_AUTOMATION_ENABLED || 'false' }}
          MODE: ${{ github.event_name == 'schedule' && 'publish' || github.event.inputs.mode }}
        run: |
          uv run python -m scripts.election_automation \
            --repo-root "$GITHUB_WORKSPACE/simulator" \
            --site-repo "$GITHUB_WORKSPACE/website" \
            --event-name "$EVENT_NAME" \
            --schedule "$EVENT_SCHEDULE" \
            --mode "$MODE" \
            --automation-enabled "$ELECTION_AUTOMATION_ENABLED" \
