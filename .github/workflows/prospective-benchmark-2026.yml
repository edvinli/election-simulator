name: Prospective benchmark 2026 capture

on:
  # Two delivery mechanisms for one unchanged scheduled trigger.
  #
  # GitHub's cron is retained, and is no longer relied upon alone: it delivered
  # the 2026-09-04, 05 and 06 ticks 1h42m, 1h41m and 1h44m late, and the third
  # of those was already running the 20:30Z pre-warm. The timing-eligible
  # window is thirty minutes wide (21:30:00Z to 22:00:00Z) and this job takes
  # under a minute, so the failure is in delivery, not in the capture. An
  # independent external scheduler (ops/benchmark-trigger-worker) therefore
  # dispatches the same workflow with mode=scheduled_capture. See amendment
  # 006. Keeping the cron means neither scheduler is a single point of failure.
  schedule:
    # 22:30 Europe/Stockholm during the frozen Sep 4–12 campaign window: one
    # hour before the frozen 23:30 cutoff, so checkout, dependency install and
    # the capture gates finish while retrieval is still prohibited. The job
    # then waits for the cutoff, which is unchanged. Starting *at* the cutoff
    # is why 2026-09-04 and 2026-09-05 archived LATE_EXCLUDED records.
    # The guard below restricts the otherwise yearless GitHub cron expression.
    - cron: "30 20 * 9 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry run, one operator capture, or an unattended external scheduled trigger"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - capture
          - scheduled_capture
      scheduled_date:
        description: "Frozen Stockholm slot (YYYY-MM-DD); required for manual capture, IGNORED by scheduled_capture"
        required: false
        default: "2026-09-04"
        type: string

permissions:
  contents: read

# Share the production lock. A benchmark checkout must never race an unfinished
# publication generation into or out of the cutoff selection set.
concurrency:
  group: election-simulator-production
  cancel-in-progress: false

jobs:
  # Resolve the intended slot without mutating the repository. A scheduled
  # GitHub event has no year/date field, so the slot is derived from GitHub's
  # recorded run creation time by the same frozen rule the capture job uses:
  # scripts/prospective_benchmark_2026/time_rules.py. That module is stdlib
  # only and is invoked by path, so this job needs no dependency install, and
  # the attribution rule has exactly one tested implementation instead of a
  # shell copy that has to be kept in step with it.
  #
  # An external scheduled_capture dispatch takes exactly that branch. It
  # supplies no date and no timestamp, so its slot provenance is identical to
  # the cron's rather than merely equivalent to it, and there is no operator
  # claim for the frozen rules to have to distrust.
  schedule_guard:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.resolve.outputs.active }}
      mode: ${{ steps.resolve.outputs.mode }}
      scheduled_date: ${{ steps.resolve.outputs.scheduled_date }}
      capture_id: ${{ steps.resolve.outputs.capture_id }}
      unattended: ${{ steps.resolve.outputs.unattended }}
    steps:
      - name: Check out the frozen scheduling rules
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve intended scheduled slot and guard the frozen window
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MANUAL_MODE: ${{ github.event.inputs.mode || '' }}
          MANUAL_DATE: ${{ github.event.inputs.scheduled_date || '' }}
        run: |
          # Two trigger classes reach this workflow.
          #
          #   unattended -- GitHub's cron, and the external scheduler's
          #     dispatch with mode=scheduled_capture. Neither names a slot, so
          #     both resolve one identically, from GitHub's recorded run
          #     creation time. No dispatch input participates.
          #
          #   operator -- a human dry_run or capture, which names its own slot
          #     and is held to the existing manual rules.
          UNATTENDED=false
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            UNATTENDED=true
            MODE="capture"
          else
            case "$MANUAL_MODE" in
              scheduled_capture)
                # The unattended external trigger. It runs the capture job,
                # and is held to the scheduled path's strict rules below.
                UNATTENDED=true
                MODE="capture"
                ;;
              dry_run|capture)
                MODE="$MANUAL_MODE"
                ;;
              *)
                echo "Manual mode must be dry_run, capture or scheduled_capture: $MANUAL_MODE" >&2
                exit 2
                ;;
            esac
          fi
          if [[ "$UNATTENDED" == "true" ]]; then
            # Bind the slot to GitHub's externally recorded workflow-run
            # creation time, not the possibly delayed runner wall clock and
            # never a dispatch input. If that evidence cannot be retrieved,
            # fail closed.
            RUN_CREATED_AT="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq .created_at)"
            if [[ ! "$RUN_CREATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
              echo "Cannot establish the scheduled run creation time." >&2
              exit 2
            fi
            # A run created at or after the 22:30 Europe/Stockholm scheduled
            # start belongs to that Stockholm date even when the scheduler
            # delays it past the cutoff. A run created before that local start
            # has been delayed across local midnight and belongs to the
            # PREVIOUS slot, which will be durably LATE_EXCLUDED.
            #
            # That boundary is 20:30Z during the frozen window, and it is why
            # no external tick may be configured earlier than 20:30Z: an
            # earlier one would resolve to, and could durably occupy, the
            # previous day's slot. ops/benchmark-trigger-worker asserts it.
            if ! SCHEDULED_DATE="$(python scripts/prospective_benchmark_2026/time_rules.py \
              resolve-slot --run-created-at "$RUN_CREATED_AT")"; then
              echo "Cannot resolve the intended Stockholm slot from $RUN_CREATED_AT." >&2
              exit 2
            fi
          else
            SCHEDULED_DATE="$MANUAL_DATE"
          fi
          if [[ ! "$SCHEDULED_DATE" =~ ^2026-09-(0[4-9]|1[0-2])$ ]]; then
            if [[ "$UNATTENDED" == "true" ]]; then
              # The external cron, like GitHub's, has no year field, so ticks
              # outside the frozen window are expected and are a green no-op.
              echo "active=false" >> "$GITHUB_OUTPUT"
              echo "mode=$MODE" >> "$GITHUB_OUTPUT"
              echo "unattended=$UNATTENDED" >> "$GITHUB_OUTPUT"
              echo "Unattended trigger is outside the frozen 2026-09-04..12 window." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Manual scheduled_date is outside the frozen window: $SCHEDULED_DATE" >&2
            exit 2
          fi
          # A slot that already holds a timing-eligible durable capture is
          # finished. Redundant external ticks exist precisely so that one of
          # them lands, so the ones that arrive afterwards must be a cheap,
          # visible no-op rather than a red run.
          #
          # This reads the recorded timing_eligible field; it does not
          # re-derive eligibility, and it is not what enforces one capture per
          # slot -- append_capture still refuses an occupied slot. A slot
          # holding an INELIGIBLE record is deliberately NOT stood down: that
          # collision must stay loud.
          if [[ "$UNATTENDED" == "true" ]] && jq -e --arg slot "$SCHEDULED_DATE" \
            '[.captures[] | select(.scheduled_date == $slot and .timing_eligible == true)] | length > 0' \
            data/processed/prospective_benchmark_2026/index.json >/dev/null; then
            {
              echo "active=false"
              echo "mode=$MODE"
              echo "unattended=$UNATTENDED"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Prospective benchmark slot guard"
              echo "- Event: $EVENT_NAME"
              echo "- Workflow run created at: ${RUN_CREATED_AT:-manual dispatch}"
              echo "- Scheduled Stockholm date: $SCHEDULED_DATE"
              echo "- Stand-down: SLOT_ALREADY_TIMING_ELIGIBLE"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CAPTURE_ID="$(date -u --date="$SCHEDULED_DATE 21:30:00" +%Y%m%dT%H%M%SZ)"
          {
            echo "active=true"
            echo "mode=$MODE"
            echo "scheduled_date=$SCHEDULED_DATE"
            echo "capture_id=$CAPTURE_ID"
            echo "unattended=$UNATTENDED"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Prospective benchmark slot guard"
            echo "- Event: $EVENT_NAME"
            echo "- Unattended scheduled trigger: $UNATTENDED"
            echo "- Workflow run created at: ${RUN_CREATED_AT:-manual dispatch}"
            echo "- Guard evaluated at: $(TZ=Europe/Stockholm date --iso-8601=seconds)"
            echo "- Scheduled Stockholm date: $SCHEDULED_DATE"
            echo "- Mode: $MODE"
          } >> "$GITHUB_STEP_SUMMARY"

  dry_run:
    if: needs.schedule_guard.outputs.active == 'true' && needs.schedule_guard.outputs.mode == 'dry_run'
    needs: schedule_guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out simulator without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies and verify a clean checkout
        shell: bash
        run: |
          uv sync --frozen
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run prospective capture gates
        run: |
          uv run python -m unittest \
            tests.test_prospective_archive \
            tests.test_prospective_benchmark_2026_capture \
            tests.test_prospective_benchmark_2026_archive \
            tests.test_prospective_benchmark_2026_results \
            tests.test_prospective_benchmark_2026_report \
            tests.test_prospective_benchmark_scoring \
            tests.test_prospective_benchmark_2026_botten_ada_capture \
            tests.test_prospective_benchmark_2026_adversarial \
            tests.test_exact_draw_sidecar \
            tests.test_prospective_benchmark_2026_schedule \
            tests.test_prospective_benchmark_2026_workflow

      - name: Execute non-durable benchmark dry run
        shell: bash
        env:
          SCHEDULED_DATE: ${{ needs.schedule_guard.outputs.scheduled_date }}
        run: |
          uv run python -m scripts.prospective_benchmark_2026 capture \
            --mode dry_run \
            --scheduled-date "$SCHEDULED_DATE" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: Verify dry run left the repository untouched
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "Dry run completed without durable files or repository changes." >> "$GITHUB_STEP_SUMMARY"

  capture:
    if: needs.schedule_guard.outputs.active == 'true' && needs.schedule_guard.outputs.mode == 'capture'
    needs: schedule_guard
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # The prewarmed start means this job idles until the frozen cutoff: up to an
    # hour of deliberate waiting, plus the capture itself. The old 45-minute
    # budget assumed a job that began at the cutoff.
    timeout-minutes: 120
    steps:
      - name: Check out the simulator with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies and verify a clean checkout
        shell: bash
        run: |
          uv sync --frozen
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run prospective capture gates
        run: |
          uv run python -m unittest \
            tests.test_prospective_archive \
            tests.test_prospective_benchmark_2026_capture \
            tests.test_prospective_benchmark_2026_archive \
            tests.test_prospective_benchmark_2026_results \
            tests.test_prospective_benchmark_2026_report \
            tests.test_prospective_benchmark_scoring \
            tests.test_prospective_benchmark_2026_botten_ada_capture \
            tests.test_prospective_benchmark_2026_adversarial \
            tests.test_exact_draw_sidecar \
            tests.test_prospective_benchmark_2026_schedule \
            tests.test_prospective_benchmark_2026_workflow

      # Everything above this point is prewarming: it must not retrieve or
      # record any benchmark evidence. The real capture starts only once the
      # frozen cutoff has arrived, and run_capture independently refuses a
      # durable capture before it.
      - name: Wait for the frozen 23:30 Europe/Stockholm cutoff
        shell: bash
        env:
          SCHEDULED_DATE: ${{ needs.schedule_guard.outputs.scheduled_date }}
        run: |
          WAITED="$(python scripts/prospective_benchmark_2026/time_rules.py \
            wait-for-cutoff --scheduled-date "$SCHEDULED_DATE")"
          echo "- Cutoff wait: $WAITED" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture official contemporaneous evidence
        shell: bash
        env:
          CAPTURE_MODE: capture
          SCHEDULED_DATE: ${{ needs.schedule_guard.outputs.scheduled_date }}
        run: |
          uv run python -m scripts.prospective_benchmark_2026 capture \
            --mode "$CAPTURE_MODE" \
            --scheduled-date "$SCHEDULED_DATE" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: Validate the complete immutable archive
        run: uv run python -m scripts.prospective_benchmark_2026 validate

      - name: Verify only the expected benchmark slot changed
        shell: bash
        env:
          CAPTURE_ID: ${{ needs.schedule_guard.outputs.capture_id }}
        run: |
          test -z "$(git status --porcelain --untracked-files=all | awk -v id="$CAPTURE_ID" '
            $2 != "data/processed/prospective_benchmark_2026/index.json" &&
            index($2, "data/processed/prospective_benchmark_2026/captures/" id "/") != 1 {print}')"
          git diff --exit-code -- \
            data/processed/prospective_benchmark_2026/protocol.json \
            data/processed/prospective_benchmark_2026/protocol.sha256 \
            docs/2026_prospective_benchmark_protocol.md

      - name: Commit and push the append-only capture
        shell: bash
        env:
          CAPTURE_ID: ${{ needs.schedule_guard.outputs.capture_id }}
          SCHEDULED_DATE: ${{ needs.schedule_guard.outputs.scheduled_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/processed/prospective_benchmark_2026/index.json \
            "data/processed/prospective_benchmark_2026/captures/$CAPTURE_ID"
          test -z "$(git diff --cached --name-only | awk -v id="$CAPTURE_ID" '
            $0 != "data/processed/prospective_benchmark_2026/index.json" &&
            index($0, "data/processed/prospective_benchmark_2026/captures/" id "/") != 1 {print}')"
          git commit -m "chore: capture prospective benchmark $SCHEDULED_DATE"
          git push origin HEAD:main
          {
            echo "### Prospective benchmark capture"
            echo "- Scheduled Stockholm date: $SCHEDULED_DATE"
            echo "- Capture ID: $CAPTURE_ID"
            echo "- Archive validation: PASS"
            echo "- Commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      # An append that is not timing-eligible leaves the archive intact and the
      # benchmark slot empty. Those two outcomes must not both look green: a
      # scheduled slot without eligible evidence fails the run.
      - name: Require a timing-eligible capture for the scheduled slot
        if: always()
        shell: bash
        env:
          # Both unattended delivery mechanisms are held to this. An operator
          # dry_run or capture is attended and only warns.
          UNATTENDED: ${{ needs.schedule_guard.outputs.unattended }}
          SCHEDULED_DATE: ${{ needs.schedule_guard.outputs.scheduled_date }}
        run: |
          ARGS=(--scheduled-date "$SCHEDULED_DATE" --summary-path "$GITHUB_STEP_SUMMARY")
          if [[ "$UNATTENDED" != "true" ]]; then
            ARGS+=(--warn-only)
          fi
          uv run python -m scripts.prospective_benchmark_2026 assert-eligible "${ARGS[@]}"
